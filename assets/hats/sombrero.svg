<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" shape-rendering="crispEdges">
  <!-- Very wide brim -->
  <rect fill="#cc8822" x="2"  y="10" width="28" height="2"/>
  <!-- Curved brim ends -->
  <rect fill="#aa6611" x="2"  y="11" width="3"  height="1"/>
  <rect fill="#aa6611" x="27" y="11" width="3"  height="1"/>
  <!-- Crown -->
  <rect fill="#ddaa33" x="10" y="4"  width="12" height="7"/>
  <!-- Band -->
  <rect fill="#ff4400" x="10" y="8"  width="12" height="1"/>
  <!-- Decorations -->
  <rect fill="#ffdd00" x="11" y="5"  width="1"  height="1"/>
  <rect fill="#ffdd00" x="14" y="5"  width="1"  height="1"/>
  <rect fill="#ffdd00" x="17" y="5"  width="1"  height="1"/>
  <rect fill="#ffdd00" x="20" y="5"  width="1"  height="1"/>
</svg>
