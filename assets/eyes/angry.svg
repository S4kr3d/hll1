<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" shape-rendering="crispEdges">
  <!-- Left eye white -->
  <rect fill="white" x="8"  y="14" width="6" height="3"/>
  <!-- Left angry brow (diagonal) -->
  <rect fill="#222" x="8"  y="12" width="1" height="1"/>
  <rect fill="#222" x="9"  y="13" width="1" height="1"/>
  <rect fill="#222" x="10" y="13" width="1" height="1"/>
  <rect fill="#222" x="11" y="13" width="1" height="1"/>
  <rect fill="#222" x="12" y="13" width="2" height="1"/>
  <!-- Left pupil -->
  <rect fill="#330000" x="10" y="14" width="2" height="2"/>
  <!-- Right eye white -->
  <rect fill="white" x="18" y="14" width="6" height="3"/>
  <!-- Right angry brow -->
  <rect fill="#222" x="18" y="12" width="2" height="1"/>
  <rect fill="#222" x="20" y="13" width="1" height="1"/>
  <rect fill="#222" x="21" y="13" width="1" height="1"/>
  <rect fill="#222" x="22" y="13" width="1" height="1"/>
  <rect fill="#222" x="23" y="12" width="1" height="1"/>
  <!-- Right pupil -->
  <rect fill="#330000" x="20" y="14" width="2" height="2"/>
</svg>
