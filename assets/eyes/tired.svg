<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" shape-rendering="crispEdges">
  <!-- Left eye half-closed -->
  <rect fill="white" x="8"  y="15" width="6" height="3"/>
  <!-- Half-lid -->
  <rect fill="#888" x="8"  y="14" width="6" height="1"/>
  <rect fill="#888" x="8"  y="13" width="6" height="1"/>
  <!-- Pupil -->
  <rect fill="#333" x="10" y="16" width="2" height="1"/>
  <!-- Right eye half-closed -->
  <rect fill="white" x="18" y="15" width="6" height="3"/>
  <rect fill="#888" x="18" y="14" width="6" height="1"/>
  <rect fill="#888" x="18" y="13" width="6" height="1"/>
  <rect fill="#333" x="20" y="16" width="2" height="1"/>
  <!-- Bags under eyes -->
  <rect fill="#aaa" x="8"  y="18" width="6" height="1" opacity="0.4"/>
  <rect fill="#aaa" x="18" y="18" width="6" height="1" opacity="0.4"/>
</svg>
