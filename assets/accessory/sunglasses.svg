<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" shape-rendering="crispEdges">
  <!-- Left lens -->
  <rect fill="#111122" x="7"  y="13" width="8"  height="5"/>
  <rect fill="#222244" x="8"  y="13" width="6"  height="5"/>
  <!-- Right lens -->
  <rect fill="#111122" x="17" y="13" width="8"  height="5"/>
  <rect fill="#222244" x="18" y="13" width="6"  height="5"/>
  <!-- Bridge -->
  <rect fill="#555"    x="15" y="14" width="2"  height="1"/>
  <!-- Shine left -->
  <rect fill="#4444aa" x="8"  y="14" width="2"  height="1"/>
  <!-- Shine right -->
  <rect fill="#4444aa" x="18" y="14" width="2"  height="1"/>
  <!-- Frame outline -->
  <rect fill="#333"    x="7"  y="12" width="8"  height="1"/>
  <rect fill="#333"    x="17" y="12" width="8"  height="1"/>
  <rect fill="#333"    x="7"  y="18" width="8"  height="1"/>
  <rect fill="#333"    x="17" y="18" width="8"  height="1"/>
  <!-- Temples -->
  <rect fill="#555"    x="6"  y="13" width="1"  height="4"/>
  <rect fill="#555"    x="25" y="13" width="1"  height="4"/>
</svg>
