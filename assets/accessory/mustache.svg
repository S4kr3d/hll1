  <rect fill="#4a3000" x="10" y="19" width="12" height="2"/>
  <rect fill="#4a3000" x="9"  y="20" width="2"  height="1"/>
  <rect fill="#4a3000" x="21" y="20" width="2"  height="1"/>
  <!-- Left curl -->
  <rect fill="#4a3000" x="8"  y="19" width="2"  height="1"/>
  <rect fill="#4a3000" x="7"  y="18" width="2"  height="2"/>
  <!-- Right curl -->
