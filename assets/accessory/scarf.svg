<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" shape-rendering="crispEdges">
  <!-- Scarf wrap -->
  <rect fill="#cc2200" x="5"  y="20" width="22" height="3"/>
  <!-- Knot/fold -->
  <rect fill="#aa1100" x="5"  y="21" width="22" height="1"/>
  <!-- Hanging end -->
  <rect fill="#cc2200" x="19" y="23" width="4"  height="4"/>
  <rect fill="#aa1100" x="19" y="24" width="4"  height="1"/>
  <!-- Stripes -->
  <rect fill="#ff4422" x="5"  y="20" width="22" height="1"/>
  <rect fill="#ff4422" x="19" y="23" width="4"  height="1"/>
</svg>
