<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" shape-rendering="crispEdges">
  <!-- Ghost body pixel art - color is set via CSS fill on the .ghost-body class -->
  <!-- Row by row pixel placement on 32x32 grid, each pixel = 1 unit -->
  <!-- Head dome -->
  <rect class="ghost-body" x="10" y="4"  width="12" height="1"/>
  <rect class="ghost-body" x="8"  y="5"  width="16" height="1"/>
  <rect class="ghost-body" x="7"  y="6"  width="18" height="1"/>
  <rect class="ghost-body" x="6"  y="7"  width="20" height="1"/>
  <rect class="ghost-body" x="6"  y="8"  width="20" height="1"/>
  <rect class="ghost-body" x="5"  y="9"  width="22" height="1"/>
  <rect class="ghost-body" x="5"  y="10" width="22" height="1"/>
  <rect class="ghost-body" x="5"  y="11" width="22" height="1"/>
  <rect class="ghost-body" x="5"  y="12" width="22" height="1"/>
  <rect class="ghost-body" x="5"  y="13" width="22" height="1"/>
  <rect class="ghost-body" x="5"  y="14" width="22" height="1"/>
  <rect class="ghost-body" x="5"  y="15" width="22" height="1"/>
  <rect class="ghost-body" x="5"  y="16" width="22" height="1"/>
  <rect class="ghost-body" x="5"  y="17" width="22" height="1"/>
  <rect class="ghost-body" x="5"  y="18" width="22" height="1"/>
  <rect class="ghost-body" x="5"  y="19" width="22" height="1"/>
  <rect class="ghost-body" x="5"  y="20" width="22" height="1"/>
  <rect class="ghost-body" x="5"  y="21" width="22" height="1"/>
  <rect class="ghost-body" x="5"  y="22" width="22" height="1"/>
  <!-- Wavy hem: 3 bumps -->
  <rect class="ghost-body" x="5"  y="23" width="4"  height="1"/>
  <rect class="ghost-body" x="11" y="23" width="4"  height="1"/>
  <rect class="ghost-body" x="17" y="23" width="4"  height="1"/>
  <rect class="ghost-body" x="23" y="23" width="4"  height="1"/>
  <rect class="ghost-body" x="5"  y="24" width="3"  height="1"/>
  <rect class="ghost-body" x="12" y="24" width="2"  height="1"/>
  <rect class="ghost-body" x="18" y="24" width="2"  height="1"/>
  <rect class="ghost-body" x="24" y="24" width="3"  height="1"/>
  <!-- Outline (dark border, always black) -->
  <rect class="ghost-outline" x="10" y="3"  width="12" height="1"/>
  <rect class="ghost-outline" x="8"  y="4"  width="2"  height="1"/>
  <rect class="ghost-outline" x="20" y="4"  width="2"  height="1"/>
  <rect class="ghost-outline" x="7"  y="5"  width="1"  height="1"/>
  <rect class="ghost-outline" x="23" y="5"  width="1"  height="1"/>
  <rect class="ghost-outline" x="6"  y="6"  width="1"  height="17"/>
  <rect class="ghost-outline" x="26" y="6"  width="1"  height="17"/>
  <rect class="ghost-outline" x="5"  y="7"  width="1"  height="16"/>
  <rect class="ghost-outline" x="27" y="7"  width="1"  height="16"/>
  <!-- Hem outline bottom -->
  <rect class="ghost-outline" x="5"  y="25" width="3"  height="1"/>
  <rect class="ghost-outline" x="9"  y="24" width="2"  height="1"/>
  <rect class="ghost-outline" x="9"  y="23" width="2"  height="1"/>
  <rect class="ghost-outline" x="11" y="25" width="1"  height="1"/>
  <rect class="ghost-outline" x="12" y="26" width="1"  height="1"/>
  <rect class="ghost-outline" x="13" y="25" width="1"  height="1"/>
  <rect class="ghost-outline" x="14" y="24" width="2"  height="1"/>
  <rect class="ghost-outline" x="14" y="23" width="3"  height="1"/>
  <rect class="ghost-outline" x="17" y="25" width="1"  height="1"/>
  <rect class="ghost-outline" x="18" y="26" width="1"  height="1"/>
  <rect class="ghost-outline" x="19" y="25" width="1"  height="1"/>
  <rect class="ghost-outline" x="20" y="24" width="2"  height="1"/>
  <rect class="ghost-outline" x="20" y="23" width="3"  height="1"/>
  <rect class="ghost-outline" x="23" y="25" width="1"  height="1"/>
  <rect class="ghost-outline" x="24" y="26" width="1"  height="1"/>
  <rect class="ghost-outline" x="25" y="25" width="1"  height="1"/>
  <rect class="ghost-outline" x="25" y="24" width="2"  height="1"/>
  <rect class="ghost-outline" x="25" y="23" width="2"  height="1"/>
  <!-- Highlight (always white, top-left of dome) -->
  <rect class="ghost-highlight" x="9"  y="6"  width="3"  height="1"/>
  <rect class="ghost-highlight" x="8"  y="7"  width="2"  height="1"/>
  <rect class="ghost-highlight" x="8"  y="8"  width="2"  height="1"/>
</svg>
